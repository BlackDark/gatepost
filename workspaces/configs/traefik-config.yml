global:
  checkNewVersion: true
  sendAnonymousUsage: true

entryPoints:
  web:
    address: :80
  websecure:
    address: :443

# Enable API and dashboard
api:
  insecure: true
  dashboard: true
  debug: true

experimental:
  localPlugins:
    gatepost:
      moduleName: github.com/BlackDark/gatepost
  # To test the released version
  #plugins:
  #  gatepost:
  #    moduleName: "github.com/BlackDark/gatepost"
  #    version: v0.20.1
  
providers:
  file:
    filename: /etc/traefik/configs/http.yml
    watch: true
