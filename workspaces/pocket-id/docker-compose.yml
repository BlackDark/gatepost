services:
  pocketId:
    image: ghcr.io/pocket-id/pocket-id:v2.19.1@sha256:f085157f0b6ea4b2e8aa5ecfd99eada0d83a4960f3a3dcfd46014097d0ef7ab5
    restart: unless-stopped
    ports:
      - 1411:1411
    environment:
      APP_URL: http://localhost:1411
    volumes:
      - "pocketId_data:/app/data"

  traefik:
    image: "traefik:v3.7.16@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2"
    ports:
      - "9080:80"
      - "8080:8080"
    extra_hosts:
      - "localhost:172.17.0.1" # To make OIDC discovery work correctly
    volumes:
      - "../configs/traefik-config.yml:/etc/traefik/traefik.yml:ro"
      - "../configs/http.yml:/etc/traefik/configs/http.yml:ro"
      - "../..:/plugins-local/src/github.com/BlackDark/gatepost:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    env_file:
      - ./.env

  whoami:
    image: "traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44"

volumes:
  pocketId_data:
