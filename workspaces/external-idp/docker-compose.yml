services:
  traefik:
    image: "traefik:v3.7.16@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2"
    ports:
      - "9080:80"
      - "8080:8080"
    volumes:
      - "../configs/traefik-config.yml:/etc/traefik/traefik.yml:ro"
      - "../configs/http.yml:/etc/traefik/configs/http.yml:ro"
      - "../..:/plugins-local/src/github.com/BlackDark/gatepost:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    env_file:
      - ./.env

  whoami:
    image: "traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44"
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.whoami.rule=HostRegexp(`.+`)
    #   - traefik.http.routers.whoami.middlewares=auth
    #   - traefik.http.middlewares.auth.plugin.gatepost.logLevel=DEBUG
    #   - traefik.http.middlewares.auth.plugin.gatepost.provider.urlEnv=PROVIDER_URL
    #   - traefik.http.middlewares.auth.plugin.gatepost.provider.usepkce=true
    #   - traefik.http.middlewares.auth.plugin.gatepost.provider.clientidEnv=CLIENT_ID
    #   - traefik.http.middlewares.auth.plugin.gatepost.provider.clientsecretEnv=CLIENT_SECRET
    #   - traefik.http.middlewares.auth.plugin.gatepost.scopes=openid,profile
    #   #- traefik.http.middlewares.auth.plugin.gatepost.scopes[0]=openid

volumes:
  pocketId_data:
