# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # cmd/extauth-server is a separate Go module (own go.mod/go.sum), so the "/"
  # entry above never sees its dependencies - without this, envoyproxy/go-control-plane,
  # grpc and friends were never updated.
  - package-ecosystem: gomod
    directory: "/cmd/extauth-server"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: bun
    directory: "/website"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      website: # Just a name
        patterns: ["*"]
    allow:
      - dependency-name: "@docusaurus/*"

  # The e2e suite is its own bun workspace with a separate lockfile; the
  # /website entry above does not cover it, so Playwright and Biome were
  # never updated. Grouped to keep one PR per week.
  - package-ecosystem: bun
    directory: "/e2e"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      e2e: # Just a name
        patterns: ["*"]
