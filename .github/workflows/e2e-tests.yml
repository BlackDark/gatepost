name: E2E Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "website/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: E2E tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Note: You cannot connect from the "Warp" terminal for whatever reason.
      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3
      #   with:
      #     detached: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned: `latest` silently moves under us, and a bun minor bump can
          # change lint output and Playwright behaviour between two runs of the
          # same commit. 1.4.2 is the bun release this repo is developed against.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare tests
        run: bun run prepare
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: bunx playwright test --project=mock-oidc
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ./e2e/playwright-report/
          retention-days: 30

  test-keycloak:
    name: E2E tests (keycloak)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # The keycloak project is the only coverage of the provider cABundle /
    # cABundleFile custom-CA path, so it must not stay unrun. It needs a
    # generated throwaway CA plus a privileged keycloak container, which makes
    # it too slow and too environment-sensitive to gate every PR: run it on
    # main and on demand instead, and rely on the mock-oidc job for PR signal.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned: `latest` silently moves under us, and a bun minor bump can
          # change lint output and Playwright behaviour between two runs of the
          # same commit. 1.4.2 is the bun release this repo is developed against.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Generates the throwaway CA that the custom-CA trust tests need and pulls
      # the keycloak images; not the mock-oidc `prepare` script.
      - name: Prepare tests
        run: bun run prepare:keycloak

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: bunx playwright test --project=keycloak
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-keycloak
          path: ./e2e/playwright-report/
          retention-days: 30
