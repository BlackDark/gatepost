name: E2E Tests
# website/** is skipped because a docs change cannot break the auth behaviour
# these tests exercise (the only website-driven e2e surface is links, which the
# `bun run build` in .github/workflows/lint.yml gates - onBrokenLinks is 'throw').
# Dropping that paths-ignore would buy nothing but ~60min of Playwright per
# docs typo.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "website/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: E2E tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Note: You cannot connect from the "Warp" terminal for whatever reason.
      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3
      #   with:
      #     detached: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned: `latest` silently moves under us, and a bun minor bump can
          # change lint output and Playwright behaviour between two runs of the
          # same commit. 1.4.2 is the bun release this repo is developed against.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare tests
        run: bun run prepare
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          set -o pipefail
          bunx playwright test --project=mock-oidc 2>&1 | tee /tmp/pw.log
        env:
          CI: true

      # Job logs can only be fetched with admin rights, and the step log is
      # truncated, so a red run has historically been undiagnosable from outside.
      # GitHub turns ::error:: lines into check annotations, which ARE readable
      # from the public API, so publish the useful part of a failure there.
      # Deliberately last so it also covers a beforeAll that never ran.
      - name: Publish failure detail as annotations
        if: ${{ failure() }}
        run: |
          set -uo pipefail
          emit() {
            # Workflow commands are line delimited and treat % and CR as
            # escapes, so neutralise both before emitting.
            printf '%s\n' "$1" | tr -d '\r' | sed 's/%/%25/g' | head -c 900 |
              sed 's/^/::error::/'
          }
          if [ ! -f /tmp/pw.log ]; then
            emit "Playwright produced no output: the failure was before the test runner (fixture, compose up, or image build)."
            exit 0
          fi
          emit "=== failed test names ==="
          grep -E '^[[:space:]]+[0-9]+\) ' /tmp/pw.log | head -25 | while IFS= read -r l; do emit "$l"; done
          emit "=== playwright summary ==="
          grep -E '^[[:space:]]+[0-9]+ (failed|passed|flaky|skipped|did not run)' /tmp/pw.log | head -10 | while IFS= read -r l; do emit "$l"; done
          emit "=== error headlines ==="
          grep -E 'Error:|Timed out|expect\(|received:|Expected' /tmp/pw.log | head -25 | while IFS= read -r l; do emit "$l"; done

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ./e2e/playwright-report/
          retention-days: 30

  # Custom-CA trust for the plugin's server-to-server TLS client to the IdP
  # (provider.cABundle / cABundleFile). This replaces the keycloak job that used
  # to cover it: that stack needed a postgres sidecar, a realm import and a
  # two-level 4096-bit CA chain, took minutes to boot, was red on main for a
  # long time, and was gated behind workflow_dispatch/main so it gave no PR
  # signal. The TLS mock-oauth2-server variant boots in ~3s and covers the same
  # code path, so it can run on every pull request - which is what this coverage
  # actually needed. 20 minutes is generous for a ~1s cert generation plus a
  # 9-test file against one container stack.
  test-tls:
    name: E2E tests (TLS)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned: `latest` silently moves under us, and a bun minor bump can
          # change lint output and Playwright behaviour between two runs of the
          # same commit. 1.4.2 is the bun release this repo is developed against.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Generates the throwaway CA the custom-CA trust tests need and pulls the
      # mock-oauth2-server image; not the mock-oidc `prepare` script.
      - name: Prepare tests
        run: bun run prepare:tls

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: playwright
        run: |
          set -o pipefail
          bunx playwright test --project=mock-oidc-tls 2>&1 | tee /tmp/pw.log
        env:
          CI: true

      # Job logs can only be fetched with admin rights, and the step log is
      # truncated, so a red run has historically been undiagnosable from outside.
      # GitHub turns ::error:: lines into check annotations, which ARE readable
      # from the public API, so publish the useful part of a failure there.
      # Deliberately last so it also covers a beforeAll that never ran.
      - name: Publish failure detail as annotations
        if: ${{ failure() }}
        run: |
          set -uo pipefail
          emit() {
            # Workflow commands are line delimited and treat % and CR as
            # escapes, so neutralise both before emitting.
            printf '%s\n' "$1" | tr -d '\r' | sed 's/%/%25/g' | head -c 900 |
              sed 's/^/::error::/'
          }
          if [ ! -f /tmp/pw.log ]; then
            emit "Playwright produced no output: the failure was before the test runner (fixture, compose up, or image build)."
            exit 0
          fi
          emit "=== failed test names ==="
          grep -E '^[[:space:]]+[0-9]+\) ' /tmp/pw.log | head -25 | while IFS= read -r l; do emit "$l"; done
          emit "=== playwright summary ==="
          grep -E '^[[:space:]]+[0-9]+ (failed|passed|flaky|skipped|did not run)' /tmp/pw.log | head -10 | while IFS= read -r l; do emit "$l"; done
          emit "=== error headlines ==="
          grep -E 'Error:|Timed out|expect\(|received:|Expected' /tmp/pw.log | head -25 | while IFS= read -r l; do emit "$l"; done

      # The spec's afterEach dumps traefik + mock logs, but afterEach does NOT
      # run when beforeAll itself fails (compose never came up) - which is
      # exactly the failure this job is most likely to hit. This step covers that
      # gap so a future red run is diagnosable from the log alone, without admin
      # access to job logs.
      - name: Dump compose state on failure
        if: ${{ failure() && steps.playwright.outcome == 'failure' }}
        run: |
          echo "===== docker compose ps -a ====="
          docker compose -f tests/mock-oidc-tls/docker-compose.yml ps -a || true
          echo "===== mock-oauth2-server logs (tail 200) ====="
          docker compose -f tests/mock-oidc-tls/docker-compose.yml logs --no-color --tail 200 mock-oauth2-server || true
          echo "===== traefik logs (tail 200) ====="
          docker compose -f tests/mock-oidc-tls/docker-compose.yml logs --no-color --tail 200 traefik || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-tls
          path: ./e2e/playwright-report/
          retention-days: 30
