name: Lint
on:
  workflow_call:

permissions: {}

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (golangci-lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: .
          args: ./src/...

      - name: golangci-lint (gatepost-extauthz)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: ./cmd/gatepost-extauthz
          args: ./...

  govulncheck:
    name: Go (govulncheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Pinned to a released version on purpose: @latest means the scan tool
      # (and therefore the findings) can change without a commit.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./src/...

      # Same toolchain as the root module (both go.mod files pin 1.26.10). A
      # second job only repeated checkout and setup-go.
      - name: govulncheck (gatepost-extauthz)
        working-directory: ./cmd/gatepost-extauthz
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  e2e:
    name: E2E (Biome)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned: `latest` silently moves under us, and a bun minor bump can
          # change lint output and Playwright behaviour between two runs of the
          # same commit. 1.4.2 is the bun release this repo is developed against.
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  workflows:
    name: GitHub Actions (actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Installed from a pinned module version rather than a floating action
      # rhysd/actionlint#732 adds `$/` self-repository uses: support; not in a
      # release yet (latest v1.7.12 rejects `$/`). Install that PR tip until
      # upstream cuts a release that includes it.
      - name: Install actionlint
        run: |
          set -euo pipefail
          git clone --depth 1 --branch self-repository-uses-syntax \
            https://github.com/ArloL/actionlint.git /tmp/actionlint
          cd /tmp/actionlint
          # pin: ArloL/actionlint@b02c24b (rhysd/actionlint#732)
          git fetch --depth 1 origin b02c24b743cc88a26b280339814eb4ece91c32cb
          git checkout b02c24b743cc88a26b280339814eb4ece91c32cb
          go install ./cmd/actionlint

      # actionlint shells out to shellcheck and pyflakes when they are on PATH;
      # GitHub runners have neither, so without this the run: blocks are only
      # syntax-checked and the shellcheck/pyflakes passes are silently skipped.
      - name: Install shellcheck and pyflakes
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck
          pipx install pyflakes || pip install --user pyflakes

      - name: actionlint
        run: actionlint -color
