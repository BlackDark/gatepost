name: Lint
# Deliberately NO paths filter. testing.yaml and e2e-tests.yml both skip
# website/** changes, so this workflow is the only required check a
# website-only PR runs - which is exactly why the website job below builds the
# site and does not just lint it. Do not narrow these triggers to Go paths.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (golangci-lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: .
          args: ./src/...

      - name: golangci-lint (gatepost-extauthz)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: ./cmd/gatepost-extauthz
          args: ./...

  govulncheck:
    name: Go (govulncheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Pinned to a released version on purpose: @latest means the scan tool
      # (and therefore the findings) can change without a commit.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./src/...

      # Same toolchain as the root module (both go.mod files pin 1.26.8). A
      # second job only repeated checkout and setup-go.
      - name: govulncheck (gatepost-extauthz)
        working-directory: ./cmd/gatepost-extauthz
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  website:
    name: Website (Biome)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./website
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned: `latest` silently moves under us, and a bun minor bump can
          # change lint output and Playwright behaviour between two runs of the
          # same commit. 1.4.2 is the bun release this repo is developed against.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Not optional polish: website/docusaurus.config.ts sets
      # onBrokenLinks: 'throw', so a single bad relative link (or a broken MDX
      # import) fails the entire production build. Nothing else in CI built the
      # site, which is how a broken-link regression reached this branch with the
      # whole pipeline green. Runs after the Biome lint so cheap feedback comes
      # first; no extra setup needed because the bun toolchain and the frozen
      # lockfile install are already above.
      - name: Build
        run: bun run build

  e2e:
    name: E2E (Biome)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned: `latest` silently moves under us, and a bun minor bump can
          # change lint output and Playwright behaviour between two runs of the
          # same commit. 1.4.2 is the bun release this repo is developed against.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  workflows:
    name: GitHub Actions (actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Installed from a pinned module version rather than a floating action
      # reference: actionlint has no first-party action, and a moving tag would
      # make lint findings depend on when the job ran.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # actionlint shells out to shellcheck and pyflakes when they are on PATH;
      # GitHub runners have neither, so without this the run: blocks are only
      # syntax-checked and the shellcheck/pyflakes passes are silently skipped.
      - name: Install shellcheck and pyflakes
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck
          pipx install pyflakes || pip install --user pyflakes

      - name: actionlint
        run: actionlint -color
