name: Run Go tests
on:
  push:
    branches: [ main ]
  # No paths filter here: a website-only change must still be gated by a build.
  # website/** changes skip this workflow (they touch no Go code) but they DO run
  # .github/workflows/lint.yml, whose website job runs `bun run build`. That
  # build is load-bearing: docusaurus.config.ts sets onBrokenLinks: 'throw',
  # so one bad relative link fails the whole site build. Removing the build step
  # from lint.yml while keeping this paths-ignore would leave website PRs
  # completely ungated - do not do that.
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "website/**"

permissions: {}

concurrency:
  group: testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Go tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Deliberately no `go get`/`go mod download` step: the repo commits a
      # vendor/ tree and .golangci.yml pins run.modules-download-mode: readonly,
      # so a mutating dependency step would hide exactly the drift we want to see.
      - name: Verify module integrity
        run: |
          go mod verify
          git diff --exit-code -- go.mod go.sum vendor/

      # The -C ../.. is what makes the pathspecs root-relative, so they must be
      # spelled from the repository root. `git -C ../.. diff -- go.mod go.sum`
      # (the previous form) named the ROOT module's files, which the step above
      # had already checked, and therefore exited 0 even when this module's
      # go.mod drifted - proven by mutation. Note git does NOT error on a
      # pathspec that matches nothing, so a wrong path here fails open; the
      # names below are the ones the module actually has.
      - name: Verify module integrity (gatepost-extauthz)
        working-directory: ./cmd/gatepost-extauthz
        run: |
          go mod verify
          git -C ../.. diff --exit-code -- cmd/gatepost-extauthz/go.mod cmd/gatepost-extauthz/go.sum

      - name: Build
        run: go build ./...

      # ./... is load-bearing: without it `go test` only ever exercised the
      # current-directory package and src/oidc, src/utils and src/rules were
      # never compiled - which silently skipped the tamper-rejection suite.
      # -race because the middleware guards shared discovery/JWKS state behind
      # locks; -count=1 defeats the test cache so a green run is a real run.
      - name: Test with the Go CLI
        run: go test -count=1 -race ./...

      - name: Build gatepost-extauthz
        working-directory: ./cmd/gatepost-extauthz
        run: go build ./...

      - name: Test gatepost-extauthz
        working-directory: ./cmd/gatepost-extauthz
        run: go test -count=1 -race ./...

  docker:
    name: gatepost-extauthz image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Dockerfile hand-rolls cross-compilation (TARGETARCH path mapping),
      # so a plain `go build` in the Go job cannot tell us that the image still
      # builds for both published platforms. Build both here, without pushing.
      # `type=cacheonly` is required: the default output for a multi-platform
      # build is the docker exporter, which cannot write a manifest list and
      # fails the step. We want the build verified and nothing exported.
      - name: Build image for all published platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cmd/gatepost-extauthz/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly

      # A single-platform build can be loaded into the local docker image store,
      # which gives us a runnable image for the smoke tests below.
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cmd/gatepost-extauthz/Dockerfile
          platforms: linux/amd64
          load: true
          tags: gatepost-extauthz:ci

      # There is no --help flag to smoke test against, so the two observable
      # behaviours of the shipped artifact are: it refuses to come up without a
      # usable config (fail closed - never serve unauthenticated by accident),
      # and it comes up and reports its listener when given one.
      - name: Smoke test - refuses to start without a config
        run: |
          set -euo pipefail
          output="$(docker run --rm gatepost-extauthz:ci 2>&1)" && {
            echo "::error::gatepost-extauthz started without a config file"
            exit 1
          }
          echo "$output"
          grep -q "config error" <<<"$output"

      - name: Smoke test - starts and listens
        run: |
          set -euo pipefail
          cfg="$(mktemp --suffix=.yaml)"
          # This branch switched gatepost-extauthz from a JSON CONFIG_FILE to the
          # Host-keyed multi-client YAML surface, so the smoke config must be YAML.
          # Note for whoever merges this: main's copy of this step still writes
          # JSON and must be reconciled at merge time - a JSON body here is
          # rejected by this loader and the container exits immediately.
          cat >"$cfg" <<'YAML'
          clients:
            - id: smoke
              hosts: ["smoke.example.com"]
              secret: "0123456789abcdef0123456789abcdef"
              callbackUri: "/oidc/callback"
              provider:
                url: "http://127.0.0.1:1/default"
                clientId: traefik
          YAML
          # The image runs as distroless "nonroot" (uid 65532). mktemp creates
          # 0600 owned by the runner user, so without this the container cannot
          # read its own config, exits immediately, and the poll below times out.
          chmod 644 "$cfg"
          container="$(docker run --rm -d \
            -e LISTEN_ADDR=:9002 \
            -e CONFIG_FILE=/tmp/config.yaml \
            -v "$cfg:/tmp/config.yaml:ro" \
            gatepost-extauthz:ci)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            logs="$(docker logs "$container" 2>&1 || true)"
            # The config must exercise the real loader. On this branch that is
            # yaml.v3 against the yaml tags, so the keys below are the camelCase
            # Go field names; a wrong key is silently dropped rather than
            # rejected, so assert on the configured client id appearing in the
            # startup log rather than only on "it started".
            if grep -qiE "config error|init error" <<<"$logs"; then
              echo "::error::gatepost-extauthz reported a config error"
              echo "$logs"
              exit 1
            fi
            if grep -q "listening on" <<<"$logs"; then
              # Assert the configured client actually loaded. A silently
              # mis-keyed config still starts and still listens, so "it booted"
              # alone does not prove the loader was exercised.
              if grep -q "smoke.example.com" <<<"$logs"; then
                echo "gatepost-extauthz image booted, reported a listener, and loaded the configured client"
                exit 0
              fi
              echo "::error::gatepost-extauthz listened but never registered the configured host"
              echo "$logs"
              exit 1
            fi
            # Fail fast instead of burning the full 30s when the process is
            # already gone: that is always a real startup failure. --no-trunc is
            # load-bearing - `docker ps --format '{{.ID}}'` prints 12-char IDs by
            # default while `docker run -d` reports the full 64-char one, so the
            # anchored `^...$` match could never fire and the loop always ran
            # the full 30 seconds before reporting the same failure.
            if ! docker ps --no-trunc --format '{{.ID}}' | grep -qxF "$container"; then
              echo "::error::gatepost-extauthz exited before reporting a listener"
              wait "$container" 2>/dev/null || true
              docker logs "$container" 2>&1 || true
              exit 1
            fi
            sleep 1
          done
          # Diagnostics must never mask the real failure, so tolerate a
          # container that already exited and was removed.
          docker logs "$container" 2>&1 || true
          echo "::error::gatepost-extauthz never reported a listening address"
          exit 1