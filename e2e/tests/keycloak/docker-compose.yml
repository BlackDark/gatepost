services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    restart: unless-stopped
    privileged: true
    ports:
      - "8000:8080"
      - "8001:8443"
      - "9000:9000" # Health Checks
    environment:
      KC_HOSTNAME: "http://localhost:8000"
      KC_DB_URL: jdbc:postgresql://keycloak_postgres:5432/keycloak
      KC_DB: postgres
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HTTPS_CERTIFICATE_FILE: /certificates/website_cert/website.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certificates/website_cert/website.key
      KC_HTTP_MANAGEMENT_PORT: 9000
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
    healthcheck:
      # quay.io/keycloak/keycloak is UBI-micro based: it ships bash (so bash's
      # /dev/tcp redirection works) but no curl and no wget, so the usual
      # `curl -f ...` / `wget --spider ...` one-liners do not exist in this
      # image. The probe below therefore opens a raw TCP connection to the
      # management port and reads the HTTP reply using nothing but bash
      # builtins (exec / printf / read / case), so no external binary - and no
      # PATH lookup that could fail - is involved.
      #
      # It asserts both "HTTP 200" and "status UP" rather than merely "is the
      # port open": the management port is bound before the realm import
      # finishes, so a plain port probe would call the container healthy while
      # `start-dev --import-realm` is still migrating the DB and /realms/master
      # still 404s - which is exactly the race this healthcheck exists to kill.
      #
      # Note the `|| [ -n "$line" ]`: the Quarkus health body is JSON with no
      # trailing newline, so a bare `while read` loop silently discards the one
      # line we care about and the probe would never succeed.
      test:
        - CMD
        - /bin/bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000 || exit 1
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          IFS= read -r status <&3 || exit 1
          case "$status" in
            'HTTP/1.'*' 200'*) ;;
            *) exit 1 ;;
          esac
          while IFS= read -r line <&3 || [ -n "$line" ]; do
            case "$line" in
              *'"status": "UP"'*|*'"status":"UP"'*) exit 0 ;;
            esac
          done
          exit 1
      interval: 5s
      timeout: 10s
      # start_period 90s + 36 * interval 5s = up to ~4.5 min before the
      # container is declared unhealthy, which covers a cold `start-dev` doing
      # an augmented build, the DB migration and the master-realm import.
      start_period: 90s
      retries: 36
    volumes:
      - "./master-realm.json:/opt/keycloak/data/import/master-realm.json:rw"
      - "./certificates:/certificates:ro"
    depends_on:
      keycloak_postgres:
        condition: service_healthy
    command: ['start-dev', '--import-realm']

  keycloak_postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5432
    healthcheck:
      # Without this, keycloak and postgres start in parallel and keycloak can
      # lose the race and die on a refused DB connection (Quarkus does not
      # retry at startup). pg_isready ships in the postgres image.
      test: ["CMD-SHELL", "pg_isready -U postgres -d keycloak"]
      interval: 3s
      timeout: 5s
      start_period: 5s
      retries: 20

  traefik:
    image: "traefik:v3.5.0"
    ports:
      - "9080:80"
      - "9443:443"
      - "8080:8080"
    extra_hosts:
      - "localhost:172.17.0.1" # To make OIDC discovery work correctly
      - "127-0-0-1.sslip.io:172.17.0.1"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "../../../workspaces/configs/traefik-config.yml:/etc/traefik/traefik.yml:ro"
      - "../../..:/plugins-local/src/github.com/BlackDark/test-oidc-traefik-plugin:ro"
      - "../../.http.yml:/etc/traefik/configs/http.yml:ro" # Will be generated by tests
      - "./certificates:/certificates:ro"
      - "./data:/data:ro"
    environment:
      PROVIDER_URL_HTTP: http://localhost:8000/realms/master
      PROVIDER_URL_HTTPS: https://localhost:8001/realms/master
      CLIENT_ID: traefik
      CLIENT_SECRET: LQslcjK8ZeRrrhW7jKaFUUous9W5QvCr
    # Mirrors tests/mock-oidc: traefik must not exist until the IdP is genuinely
    # serving, otherwise the first request through the plugin races the OIDC
    # discovery call against a keycloak that is still starting.
    depends_on:
      keycloak:
        condition: service_healthy

  whoami:
    # Pinned like its siblings: whoami has no v3.x line to match traefik:v3.5.0,
    # so pin its newest 1.x release instead of the floating :latest.
    image: "traefik/whoami:v1.12.0"
