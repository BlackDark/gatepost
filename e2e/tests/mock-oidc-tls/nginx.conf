# TLS terminator in front of mock-oauth2-server.
#
# Why a proxy instead of letting the mock serve TLS itself: mock-oauth2-server's
# own HTTPS mode takes a keystore whose field names have to line up with its
# internal config, and when they do not match it does not fail loudly - it falls
# back to generating a fresh self-signed certificate at boot. That certificate's
# CA is unknowable from outside, so provider.cABundle can never verify it and the
# suite fails with "x509: certificate signed by unknown authority" even though the
# bundle was loaded correctly. The mock's PLAIN HTTP mode is already proven by the
# mock-oidc project, so we keep that exactly as it is and terminate TLS here, where
# the certificate under our control is unambiguous.
server {
    listen 8443 ssl;
    server_name _;

    # fullchain.pem is the leaf followed by the issuing CA; website.key is its key.
    # Both are regenerated by ./gencerts.sh on every run and never committed.
    ssl_certificate     /certificates/fullchain.pem;
    ssl_certificate_key /certificates/website.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    # The mock builds its discovery document from the forwarded scheme/host/port,
    # so these must be set or it will advertise an http issuer that does not match
    # the https URL the plugin is configured with, and the plugin's issuer
    # validation will reject its own tokens.
    location / {
        proxy_pass         http://mock-oauth2-server:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  8443;
        proxy_set_header X-Forwarded-Method $request_method;
        proxy_set_header X-Forwarded-Uri   $request_uri;
    }
}