services:
  # Plain HTTP, exactly as the green mock-oidc project runs it. TLS is terminated
  # by tls-proxy below rather than here - see nginx.conf for why.
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:5.0.2
    volumes:
      - ./config.json:/app/config.json:ro
      - ./login.html:/app/login.html:ro
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /app/config.json
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/isalive"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  # Presents the throwaway CA-signed leaf from ./gencerts.sh. This is the
  # certificate provider.cABundle has to trust.
  tls-proxy:
    image: nginx:1.31.6-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - "./certificates:/certificates:ro"
    depends_on:
      mock-oauth2-server:
        condition: service_healthy
    healthcheck:
      # --no-check-certificate is load-bearing: the leaf is self-signed, so the
      # default verifier rejects it and the container would never be reported
      # healthy. What matters here is that the TLS listener answers - whether the
      # plugin trusts the certificate is what the tests are about.
      test:
        ["CMD", "wget", "--no-check-certificate", "--spider", "-q", "https://127.0.0.1:8443/isalive"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  traefik:
    image: traefik:v3.7.14
    # Deliberately different from the mock-oidc stack's 9080/9443/8080 so the
    # two suites can be up at the same time on one runner.
    ports:
      - "9180:80"
      - "9543:443"
      - "8180:8080"
    extra_hosts:
      # The plugin dials the provider from inside this container. `localhost`
      # there is the container itself, so it is remapped onto the docker bridge
      # gateway where the host-published 8443 lands. Without these, every
      # discovery call would connect to the container's own loopback.
      - "localhost:172.17.0.1"
      - "127-0-0-1.sslip.io:172.17.0.1"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "../../../workspaces/configs/traefik-config.yml:/etc/traefik/traefik.yml:ro"
      - "../../..:/plugins-local/src/github.com/BlackDark/gatepost:ro"
      # .http-tls.yml, not .http.yml: configureTraefik stamps a per-write
      # CookieNamePrefix and both suites bind-mount their file to the same
      # in-container path, so a shared fixed name would let each stack's tests
      # overwrite the other's config mid-run.
      - "../../.http-tls.yml:/etc/traefik/configs/http.yml:ro"
      - "./certificates:/certificates:ro"
      - "./data:/data:ro"
    environment:
      # The provider is always reached over TLS through the proxy; the mock
      # itself is not published, so there is no http endpoint to point at here.
      PROVIDER_URL: https://localhost:8443/default
      PROVIDER_URL_HTTPS: https://localhost:8443/default
      CLIENT_ID: traefik
      CLIENT_SECRET: test-secret
      TOA_ENABLE_REDIRECT_URI_WILDCARDS: "true"
    depends_on:
      mock-oauth2-server:
        condition: service_healthy
      tls-proxy:
        condition: service_healthy

  whoami:
    # Pinned like its siblings: whoami has no v3.x line to match traefik:v3.7.14,
    # so pin its newest 1.x release instead of the floating :latest.
    image: "traefik/whoami:v1.12.0"