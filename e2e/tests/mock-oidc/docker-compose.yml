services:
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.3@sha256:2a813381bf282da46ff36ff386059e7903e25865056af8149f4fb3f1441916b8
    ports:
      - "8000:8080"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./login.html:/app/login.html:ro
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /app/config.json
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/isalive"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  traefik:
    image: traefik:v3.7.16@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
    ports:
      - "9080:80"
      - "9443:443"
      - "8080:8080"
    extra_hosts:
      - "localhost:172.17.0.1"
      - "127-0-0-1.sslip.io:172.17.0.1"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "../../../workspaces/configs/traefik-config.yml:/etc/traefik/traefik.yml:ro"
      - "../../..:/plugins-local/src/github.com/BlackDark/gatepost:ro"
      - "../../.http.yml:/etc/traefik/configs/http.yml:ro"
      - "./data:/data:ro"
    environment:
      PROVIDER_URL: http://localhost:8000/default
      CLIENT_ID: traefik
      CLIENT_SECRET: test-secret
      TOA_ENABLE_REDIRECT_URI_WILDCARDS: "true"
    depends_on:
      mock-oauth2-server:
        condition: service_healthy

  whoami:
    # Pinned like its siblings: whoami has no v3.x line to match traefik:v3.7.14,
    # so pin its newest 1.x release instead of the floating :latest.
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
