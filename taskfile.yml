version: '3'

tasks:
  run:external:
    desc: 'Start traefik with an externally provided identity provider'
    dir: 'workspaces/external-idp'
    preconditions:
      - test -f .env
    cmds:
      - docker compose up
  run:pocketid:
    desc: 'Start traefik with the Pocket ID identity provider'
    dir: 'workspaces/pocket-id'
    cmds:
      - docker compose up
  run:keycloak:
    desc: 'Start traefik with the Keycloak identity provider'
    dir: 'workspaces/keycloak'
    cmds:
      - docker compose up
  run:zitadel:
    desc: 'Start traefik with the ZITADEL identity provider'
    dir: 'workspaces/zitadel'
    cmds:
      - docker compose up
  run:logto:
    desc: 'Start traefik with the logto identity provider'
    dir: 'workspaces/logto'
    cmds:
      - docker compose up

  run:website:
    desc: 'Start the website in development mode'
    dir: 'website'
    cmds:
      - npm start

  build:extauth:
    desc: 'Build the standalone ext-authz server binary'
    dir: 'cmd/extauth-server'
    cmds:
      - go build -o ../../bin/extauth-server .
  run:extauth:
    desc: 'Run the standalone ext-authz server (needs CONFIG_FILE, default ./config.yaml)'
    dir: 'cmd/extauth-server'
    cmds:
      - go run .

  test:
    desc: 'Run all unit and end to end tests'
    deps:
      - test:unit
      - test:extauth
      - test:e2e
  test:unit:
    desc: 'Run all go unit tests'
    cmds:
      # ./... is required: `go test` alone only builds the current package and
      # silently skips src/oidc, src/utils and src/rules. -race because the
      # middleware shares discovery/JWKS state behind locks; -count=1 because a
      # cached pass is not evidence the tests still pass.
      - go test -count=1 -race ./...
  test:extauth:
    desc: 'Run unit tests for the standalone ext-authz server'
    dir: 'cmd/extauth-server'
    cmds:
      - go test -count=1 -race ./...
  test:e2e:
    desc: 'Run all end to end tests'
    dir: 'e2e'
    cmds:
      - npx playwright test

  lint:
    desc: 'Run all linters'
    deps:
      - lint:go
      - lint:sec
      - lint:website
      - lint:e2e
  lint:go:
    desc: 'Lint and check Go formatting'
    cmds:
      - golangci-lint run ./src/...
      - task: lint:go:extauth
  lint:go:extauth:
    desc: 'Lint the standalone ext-authz server (separate Go module)'
    dir: 'cmd/extauth-server'
    cmds:
      - golangci-lint run ./...
  lint:sec:
    desc: 'Go vulnerability check (govulncheck)'
    cmds:
      # Pinned to a released version: @latest makes the findings depend on when
      # the command ran rather than on the commit.
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./src/...
      - task: lint:sec:extauth
  lint:sec:extauth:
    desc: 'Go vulnerability check for the standalone ext-authz server (separate Go module)'
    dir: 'cmd/extauth-server'
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  lint:website:
    desc: 'Lint website with Biome'
    dir: 'website'
    cmds:
      - bun run lint
  lint:e2e:
    desc: 'Lint e2e with Biome'
    dir: 'e2e'
    cmds:
      - bun run lint

  fmt:
    desc: 'Format all code'
    deps:
      - fmt:go
      - fmt:website
      - fmt:e2e
  fmt:go:
    desc: 'Format Go code'
    cmds:
      - golangci-lint run --fix ./src/...
      - task: fmt:go:extauth
  fmt:go:extauth:
    desc: 'Format the standalone ext-authz server (separate Go module)'
    dir: 'cmd/extauth-server'
    cmds:
      - golangci-lint run --fix ./...
  fmt:website:
    desc: 'Format website with Biome'
    dir: 'website'
    cmds:
      - bun run lint:fix
  fmt:e2e:
    desc: 'Format e2e with Biome'
    dir: 'e2e'
    cmds:
      - bun run lint:fix
