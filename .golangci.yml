version: "2"

run:
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - forcetypeassert
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nilnesserr
    - noctx
    - perfsprint
    - prealloc
    - reassign
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    gosec:
      # Intentional for this middleware; see SECURITY.md / New() hardening.
      # Every ID below suppresses a REAL finding - verify that is still true
      # before touching this list, because gosec ignores unknown IDs silently:
      # an ID that no longer exists looks correct and suppresses nothing, while
      # an ID deleted too eagerly re-opens a finding somebody reasoned about.
      # To audit: delete one ID, run golangci-lint, and confirm the reported
      # sites still match the comment written under it.
      excludes:
        - G101 # DefaultSecret sentinel refused at startup
        - G117 # Encrypted session cookie must carry tokens
        # G124 fires on src/cookie.go:128 and :289 and src/session.go:307. All
        # three build their cookie through createSessionCookie /
        # makeCookieExpireImmediately, which set Secure/HttpOnly/SameSite from
        # the SessionCookie config; the flagged literal is a copy whose flags
        # are applied by those helpers, so gosec cannot see them. Suppressed
        # because fixing the code means weakening the cookie hardening this
        # middleware depends on.
        - G124
        - G402 # Provider.InsecureSkipVerify is explicit opt-in
        # G710 fires on src/main.go:856 and :1175, both http.Redirect calls fed
        # by redirectUrl. That value is only ever a target validated against
        # ValidPostLoginRedirectUris, or the state-carried post-login URI from a
        # validated callback; an attacker-controlled string never reaches it.
        # Suppressing it is not a relaxation - the allow-list check is the
        # control, and it lives outside these two lines.
        - G710
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - forcetypeassert
          - gosec
          - noctx
          - unparam
      - text: "ifElseChain"
        linters:
          - gocritic
      - text: "unlambda"
        linters:
          - gocritic
    paths:
      - third_party$
      - builtin$
      - examples$
      - vendor$

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/BlackDark/test-oidc-traefik-plugin
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - vendor$
